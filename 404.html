<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Derive the project-page prefix from the current location (the repo
        // name is the first path segment), so this file isn't coupled to it.
        var base = '/' + (window.location.pathname.split('/')[1] || '');

        // Store the requested path so the main page's router can restore it.
        localStorage.setItem('redirectPath', window.location.pathname);

        // Redirect to the app root.
        window.location.replace(base + '/');
    </script>
</head>
<body>
<p>Redirecting...</p>
</body>
</html>
