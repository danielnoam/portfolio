<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="icon" type="image/x-icon" href="/portfolio/assets/school-these-shits/favicon.ico">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/config.js"></script>
    <script type="module" src="js/main.js"></script>
    <script src="js/lightbox.js" defer></script>
</head>
<body>

<div class="mobile-top-bar">
    <button class="menu-toggle" aria-label="Toggle menu">☰</button>
    <button class="mobile-theme-toggle theme-toggle" aria-label="Toggle theme">
        <span class="theme-icon">🌓</span>
        <span class="theme-text sr-only">Toggle theme</span>
    </button>
</div>
<div class="sidebar">
    <h1 class="name">DANIEL NOAM'S PORTFOLIO</h1>
    <nav id="main-nav"></nav>
    <button id="theme-toggle" class="theme-toggle">
        <span class="theme-icon">🌓</span>
        <span class="theme-text">Toggle theme</span>
    </button>
</div>
<main>
    <div id="content">
    </div>
</main>
<button id="back-to-top" title="Back to top">↑</button>
</body>
</html>

<script>
    // Check if we came here via a redirect
    if (localStorage.getItem('redirectPath')) {
        // Don't show anything during redirect handling
        document.body.style.opacity = "0";
        document.body.style.transition = "opacity 0.5s";
        window.addEventListener('DOMContentLoaded', function() {
            // Show body after the page is fully loaded and handled
            setTimeout(function() {
                document.body.style.opacity = "1";
            }, 100);
        });
    }
</script>
